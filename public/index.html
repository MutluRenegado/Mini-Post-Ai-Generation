<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator Studio - FAST Post Creation</title>
  <style>
    body {
      background-color: #0a0c10;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 1rem;
    }
    .card {
      background-color: #12151e;
      border: 1px solid #1e2330;
      border-radius: 1.5rem;
      padding: 2.5rem;
      max-width: 500px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 1.875rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
      background: linear-gradient(to right, #6366f1, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 0.875rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .badge {
      display: inline-block;
      background: rgba(245, 158, 11, 0.2);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 0.25rem 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(to right, #06b6d4, #4f46e5, #9333ea);
      color: #ffffff;
      font-weight: 800;
      font-size: 0.875rem;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">⚡ FAST POST CREATION</div>
    <h1>Creator Studio</h1>
    <p>Production-Ready Social Media Content Studio. 1 Master Template → Facebook, Instagram, LinkedIn, X & TikTok.</p>
    <a href="/dashboard/fast-post" class="btn">Launch Creator Studio</a>
  </div>
</body>
</html>
