# Firebase App Hosting Configuration
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0

env:
  # =====================================================
  # Image Providers
  # =====================================================

  - variable: PEXELS_API_KEY
    secret: PEXELS_API_KEY

  - variable: UNSPLASH_ACCESS_KEY
    secret: UNSPLASH_ACCESS_KEY

  - variable: UNSPLASH_SECRET_KEY
    secret: UNSPLASH_SECRET_KEY

  - variable: PIXABAY_API_KEY
    secret: PIXABAY_API_KEY

  # =====================================================
  # Google AI / Gemini
  # =====================================================

  - variable: GOOGLE_GENERATIVE_AI_API_KEY
    secret: GOOGLE_GENERATIVE_AI_API_KEY

  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY

  - variable: GEMINI_SECRET_KEY
    secret: GEMINI_SECRET_KEY

  - variable: GOOGLE_API_KEY
    secret: GOOGLE_API_KEY

  # =====================================================
  # Firebase Server Credentials
  # =====================================================

  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY

  - variable: FIREBASE_PRIVATE_KEY_ID
    secret: FIREBASE_PRIVATE_KEY_ID

  # =====================================================
  # Social Providers
  # =====================================================

  - variable: BLUESKY_APP_PASSWORD
    secret: BLUESKY_APP_PASSWORD

  - variable: TELEGRAM_API_KEY
    secret: TELEGRAM_API_KEY

  # =====================================================
  # Post Proxy
  # =====================================================

  - variable: POST_PROXY_DEFAULT_API_KEY
    secret: POST_PROXY_DEFAULT_API_KEY

  - variable: POST_PROXY_MASTER_API_KEY
    secret: POST_PROXY_MASTER_API_KEY

  - variable: POST_PROXY_MEGA_API_KEY
    secret: POST_PROXY_MEGA_API_KEY

  - variable: POST_PROXY_WEBHOOK
    secret: POST_PROXY_WEBHOOK

  # =====================================================
  # Stripe
  # =====================================================

  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY

  - variable: STRIPE_WEBHOOK_SECRET_KEY
    secret: STRIPE_WEBHOOK_SECRET_KEY

  # =====================================================
  # Firebase Public Client Configuration
  # =====================================================

  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyBJOcswJYCUufYaqLT8CNVivjyb6nVdZr4"

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
